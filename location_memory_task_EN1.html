<!DOCTYPE html>
<html lang="en" class="bg-background">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location Memory Game</title>
<link rel="stylesheet" href="task.css">
</head>
<body>
<!-- =========================================================
     STAGE
     Fixed 1920 x 1080 design surface, uniformly scaled to the
     viewport, so the grid keeps the same relative screen
     position on every trial and on every machine.
     All participant-facing text is filled in by script.js from
     the STRINGS table, so the same markup serves both the
     English and the Arabic build.
     ========================================================= -->
<div id="stage">

  
  
  

  <!-- ---------- TASK LAYER (fixation / grid / target) ---------- -->
  <div id="task-layer" class="hidden">

    <!-- Prompt zone: fixed height, always reserved so the grid never moves -->
    <div id="prompt-zone">
      <div id="prompt-text"></div>
      <div id="target-icon" class="target-icon"></div>
      <div id="feedback-text"></div>
      <div id="clap" class="clap hidden"></div>
    </div>

    <!-- Fixation cross. The grid is hidden whenever this is on screen. -->
    <div id="fixation" class="hidden">+</div>

    <!-- Response grid, built by script.js for each part's layout -->
    <div id="grid" aria-label="Location grid"></div>

    <!-- Subtle progress indicator -->
    <div id="progress"></div>
  </div>

  <!-- ---------- WELCOME ---------- -->
  <section id="screen-welcome" class="screen">
    <h1 id="t-welcome-title"></h1>
    <p class="body-text" id="t-welcome-1"></p>
    <p class="body-text" id="t-welcome-2"></p>
    <p class="body-text" id="t-welcome-3"></p>
    <p class="body-text" id="t-welcome-4"></p>
    <p class="body-text" id="t-welcome-5"></p>

    <div class="field">
      <label for="participant-id" id="t-pid-label"></label>
      <input id="participant-id" type="text" autocomplete="off" spellcheck="false">
      <div id="id-error" class="field-error"></div>
    </div>

    <button id="btn-start" class="btn"></button>
  </section>

  <!-- ---------- PRACTICE INTRO ---------- -->
  <section id="screen-practice-intro" class="screen hidden">
    <h2 id="t-practice-title"></h2>
    <p class="body-text" id="t-practice-body"></p>
    <button id="btn-practice" class="btn"></button>
  </section>

  <!-- ---------- PART 1 ---------- -->
  <section id="screen-part1-intro" class="screen hidden">
    <h2 id="t-part1-title"></h2>
    <p class="body-text" id="t-part1-body"></p>
    <button id="btn-part1" class="btn"></button>
  </section>

  <!-- ---------- BREAK 1 ---------- -->
  <section id="screen-break" class="screen hidden">
    <h2 id="t-break1-title"></h2>
    <p class="body-text" id="t-break1-body"></p>
    <button id="btn-continue" class="btn"></button>
  </section>

  <!-- ---------- PART 2 ---------- -->
  <section id="screen-part2-intro" class="screen hidden">
    <h2 id="t-part2-title"></h2>
    <p class="body-text" id="t-part2-body"></p>
    <button id="btn-part2" class="btn"></button>
  </section>

  <!-- ---------- BREAK 2 ---------- -->
  <section id="screen-break-2" class="screen hidden">
    <h2 id="t-break2-title"></h2>
    <p class="body-text" id="t-break2-body"></p>
    <button id="btn-continue-2" class="btn"></button>
  </section>

  <!-- ---------- PART 3 ---------- -->
  <section id="screen-part3-intro" class="screen hidden">
    <h2 id="t-part3-title"></h2>
    <p class="body-text" id="t-part3-body"></p>
    <button id="btn-part3" class="btn"></button>
  </section>

  <!-- ---------- END (participant sees this only) ---------- -->
  <section id="screen-end" class="screen hidden">
    <h2 id="t-end-title"></h2>
    <p class="body-text" id="t-end-body"></p>
  </section>

</div>

<!-- =========================================================
     RESEARCHER STRIP — sits at the very bottom of the page,
     outside the participant's screen area. Hidden until the
     session is finished.
     ========================================================= -->
<div id="researcher-footer" class="hidden">
  <span id="t-footer-note"></span>
  <button id="btn-download-csv" class="btn-mini"></button>
  <button id="btn-download-json" class="btn-mini btn-mini-secondary"></button>
</div>
<script>window.LMT_STEP = {"kind":"hub"};</script>
<script src="task.js"></script>
</body>
</html>
